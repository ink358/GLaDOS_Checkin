name: GLaDOS Daily Checkin

on:
  schedule:
    # 每天北京时间 0:05 触发（UTC 16:05）
    - cron: '25 16 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run checkin
        env:
          # 方式一：一个 secret 搞定（推荐，格式见 README）
          GLADOS_CONFIG: ${{ secrets.GLADOS_CONFIG }}
          # 方式二：拆分的 secrets（GLADOS_CONFIG 里没写的项会从这里兜底）
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          # 发信：SMTP（推荐，普通邮箱授权码）
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          # 发信：Resend（可选，未验证域名时只能发给自己注册用的邮箱）
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # 收件人
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python GLaDOS_Checkin.py

  keepalive:
    runs-on: ubuntu-latest
    needs: checkin   # 可选：等签到完成后再执行保活，避免任务失败
    # 签到/发信失败时也照常保活，避免仓库被判定为不活跃
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if today is 8, 18, or 28
        id: date_check
        run: |
          # 获取当前北京时间的日期（UTC+8）
          DAY=$(TZ='Asia/Shanghai' date +%d)
          if [[ "$DAY" == "08" || "$DAY" == "18" || "$DAY" == "26" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      - name: Update keepalive file
        if: steps.date_check.outputs.should_run == 'true'
        run: |
          echo "Last kept alive at $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" > keepalive.txt
      - name: Commit and push
        if: steps.date_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keepalive on $(date +%Y%m%d)"
          git push
