# GLaDOS 签到配置示例（复制成自己的内容后，整段填进 GitHub secret: GLADOS_CONFIG）
#
# 说明：
#   - 发信推荐用 SMTP（普通邮箱授权码），收件人不受限制
#   - [account] 出现几次就是几个账号，每个账号会单独收到自己那封邮件
#   - 键名不区分大小写，= 和 : 都可以，# 开头是注释
#   - 账号里写了的字段覆盖全局配置，没写的继承全局
#   - 本地调试：把本文件另存为 config.local.txt，然后 GLADOS_CONFIG_FILE=config.local.txt python GLaDOS_Checkin.py
#   - 千万不要把填好内容的文件提交到仓库

# ===================== 发信配置（全局）=====================
[mail]
provider = smtp
smtp_server = smtp.qq.com
smtp_port = 465
user = 你的QQ号@qq.com
pass = 邮箱授权码
# 发件人：可以不写，不写就用上面的 user
from = GLaDOS_Checkin <你的QQ号@qq.com>

# 其它邮箱换这两行即可（465 走 SSL，587 等端口走 STARTTLS，脚本自动判断）
#   163    -> smtp.163.com : 465
#   Gmail  -> smtp.gmail.com : 587   （需开两步验证并生成应用专用密码）
#   Outlook-> smtp.office365.com : 587

# ===== 可选：用 Resend 发信 =====================================
# 注意：Resend 没验证域名时只能发给注册 Resend 用的那个邮箱，
# 发给别的地址会整封失败（403 You can only send testing emails to your own email address）。
# 想发给别的邮箱，必须先在 resend.com 验证一个你自己拥有的域名，再用域名地址当 from。
# 要把上面几行换成：
# provider = resend
# api_key = re_你的Resend_APIKey
# from = GLaDOS_Checkin <noreply@你的域名>
# ==============================================================

# 全局默认收件人与兑换计划（账号里没写时使用）
# mail_to = me@example.com
# plan = plan500


# ===================== 账号 1 =====================
[account]
name = 主账号
cookie = koa:sess=替换成完整Cookie; koa:sess.sig=替换成完整Cookie
mail_to = me@example.com, backup@example.com
plan = plan500


# ===================== 账号 2 =====================
[account]
name = 小号
cookie = koa:sess=第二个账号的Cookie; koa:sess.sig=第二个账号的Cookie
mail_to = other@example.com
plan = plan200


# ===================== 账号 3（只用全局收件人，可选）=====================
# [account]
# cookie = koa:sess=第三个账号的Cookie; koa:sess.sig=第三个账号的Cookie
